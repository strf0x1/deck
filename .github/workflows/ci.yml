name: ci
on:
  push: { branches: [main] }
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GPUI's Linux backends (Wayland, X11, Vulkan via wgpu) link these.
      # The view tests use GPUI's headless test platform, so no display.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The protocol crate never depends on GPUI (or any UI crate), so
      # protocol work builds without it. A new edge to gpui fails here.
      - name: deck-acp has no gpui
        run: |
          tree=$(cargo tree -p deck-acp)
          if grep -i gpui <<<"$tree"; then echo "deck-acp must not depend on gpui"; exit 1; fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  # Deck has only been run on Linux. This job reports whether the macOS build
  # and tests pass without blocking merges; drop continue-on-error once it is
  # green and the window has been checked on a Mac.
  check-macos:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
