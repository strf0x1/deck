name: ci
on:
  push: { branches: [main] }
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GPUI's Linux backends (Wayland, X11, Vulkan via wgpu) link these.
      # The view tests use GPUI's headless test platform, so no display.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The protocol and runtime crates never depend on GPUI (or any UI
      # crate), so that work builds without it. A new edge to gpui fails here.
      - name: deck-acp and deck-runtime have no gpui
        run: |
          for crate in deck-acp deck-runtime; do
            tree=$(cargo tree -p "$crate")
            if grep -i gpui <<<"$tree"; then echo "$crate must not depend on gpui"; exit 1; fi
          done
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 scripts/check-deckd.py
  # macOS is a primary development machine, so this blocks like Linux. The
  # window has been checked there; see AGENTS.md for the Mac driving recipe.
  check-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 scripts/check-deckd.py
