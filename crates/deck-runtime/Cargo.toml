[package]
name = "deck-runtime"
description = "deck's task runtime: lifecycle, durable task records, and the backends that run agents. No UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Never add gpui or any other UI dependency here; CI checks `cargo tree`.
[dependencies]
anyhow.workspace = true
deck-acp.workspace = true
futures.workspace = true
libc.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
ureq.workspace = true

# The OS credential store (ADR 0004 §4.2). Linux uses `secret-tool`, so the
# Secret Service needs no D-Bus stack in this crate.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[lints]
workspace = true
